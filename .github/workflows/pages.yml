name: GitHub Pages

on:
  push:
    branches: [main, cursor/bnb-era-marketplace-c781]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static export without Route Handlers
        run: NEXT_PUBLIC_API_BASE=https://era-a2a-proxy.iceline.workers.dev NEXT_PUBLIC_BASE_PATH=/bnb-era-marketplace npm run pages:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
